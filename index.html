<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#06111f">
    <meta
      name="description"
      content="Links oficiais, redes sociais e portfólio de David Sousa."
    >

    <title>David Sousa | Links</title>

    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2306111f'/%3E%3Cpath d='M23 18 9 32l14 14M41 18l14 14-14 14' fill='none' stroke='%2338bdf8' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    >

    <style>
      :root {
        color-scheme: dark;
        --text: #f8fafc;
        --muted: #a9b6c8;
        --border: rgba(148, 198, 255, 0.18);
        --surface: rgba(5, 16, 30, 0.72);
        --surface-strong: rgba(10, 25, 45, 0.88);
        --accent: #48bff7;
        --focus: #f0b56a;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        padding: 28px 18px;
        display: grid;
        place-items: center;
        overflow-x: hidden;
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background-color: #030911;
        background-image:
          linear-gradient(rgba(2, 9, 17, 0.35), rgba(2, 9, 17, 0.72)),
          url("assets/background.png");
        background-position: center;
        background-size: cover;
        background-attachment: fixed;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background:
          radial-gradient(circle at 18% 15%, rgba(37, 145, 222, 0.14), transparent 26%),
          radial-gradient(circle at 88% 84%, rgba(224, 157, 72, 0.08), transparent 23%);
      }

      .card {
        width: min(100%, 470px);
        padding: clamp(28px, 7vw, 44px);
        position: relative;
        overflow: hidden;
        text-align: center;
        border: 1px solid var(--border);
        border-radius: 28px;
        background: linear-gradient(145deg, var(--surface-strong), var(--surface));
        box-shadow:
          0 30px 90px rgba(0, 0, 0, 0.48),
          inset 0 1px 0 rgba(255, 255, 255, 0.07);
        backdrop-filter: blur(18px) saturate(130%);
        -webkit-backdrop-filter: blur(18px) saturate(130%);
      }

      .card::after {
        content: "";
        position: absolute;
        top: 0;
        left: 16%;
        width: 68%;
        height: 1px;
        background: linear-gradient(90deg, transparent, #6acbff, transparent);
        opacity: 0.75;
      }

      .avatar-wrap {
        width: 108px;
        height: 108px;
        margin: 0 auto 20px;
        padding: 3px;
        border-radius: 50%;
        background: linear-gradient(145deg, #6ed0ff, #224d78 65%, #e2a963);
        box-shadow: 0 12px 38px rgba(32, 139, 210, 0.27);
      }

      .avatar {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        border: 4px solid #081525;
        border-radius: 50%;
        background: #0a1727;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 7vw, 2.35rem);
        line-height: 1.1;
        letter-spacing: -0.04em;
      }

      .handle {
        margin: 8px 0 0;
        color: #68caf8;
        font-size: 0.95rem;
        font-weight: 650;
        letter-spacing: 0.03em;
      }

      .intro {
        max-width: 34ch;
        margin: 18px auto 28px;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.55;
      }

      .links {
        display: grid;
        gap: 13px;
      }

      .link {
        min-height: 58px;
        padding: 10px 16px;
        display: grid;
        grid-template-columns: 36px 1fr 36px;
        align-items: center;
        gap: 10px;
        position: relative;
        overflow: hidden;
        color: var(--text);
        text-decoration: none;
        border: 1px solid rgba(154, 195, 232, 0.16);
        border-radius: 16px;
        background: rgba(11, 29, 49, 0.78);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
        transition:
          transform 180ms ease,
          border-color 180ms ease,
          background-color 180ms ease,
          box-shadow 180ms ease;
      }

      .link::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(100deg, transparent 20%, var(--brand-glow), transparent 80%);
        opacity: 0;
        transition: opacity 180ms ease;
      }

      .link:hover,
      .link:focus-visible {
        transform: translateY(-2px);
        border-color: var(--brand);
        background: rgba(13, 35, 60, 0.94);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.24);
      }

      .link:hover::before,
      .link:focus-visible::before {
        opacity: 1;
      }

      .link:focus-visible {
        outline: 3px solid rgba(240, 181, 106, 0.5);
        outline-offset: 3px;
      }

      .icon-box {
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        position: relative;
        z-index: 1;
        border-radius: 11px;
        background: var(--brand);
      }

      .icon-box img,
      .icon-box svg {
        width: 19px;
        height: 19px;
        display: block;
      }

      .label {
        position: relative;
        z-index: 1;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0.01em;
      }

      .arrow {
        position: relative;
        z-index: 1;
        color: #7990a8;
        font-size: 1.1rem;
        transition: transform 180ms ease, color 180ms ease;
      }

      .link:hover .arrow,
      .link:focus-visible .arrow {
        color: #fff;
        transform: translateX(3px);
      }

      .linkedin {
        --brand: #0a66c2;
        --brand-glow: rgba(10, 102, 194, 0.2);
      }

      .instagram {
        --brand: #e4405f;
        --brand-glow: rgba(228, 64, 95, 0.2);
      }

      .github {
        --brand: #6e7681;
        --brand-glow: rgba(255, 255, 255, 0.09);
      }

      .portfolio {
        --brand: #aa6b2c;
        --brand-glow: rgba(224, 157, 72, 0.12);
        cursor: not-allowed;
        opacity: 0.68;
      }

      .status {
        position: relative;
        z-index: 1;
        padding: 5px 8px;
        justify-self: end;
        color: #ffdca8;
        font-size: 0.66rem;
        font-weight: 800;
        line-height: 1;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        border: 1px solid rgba(240, 181, 106, 0.24);
        border-radius: 999px;
        background: rgba(170, 107, 44, 0.16);
      }

      footer {
        margin-top: 25px;
        color: #708298;
        font-size: 0.78rem;
        letter-spacing: 0.04em;
      }

      @media (max-width: 420px) {
        body {
          padding: 14px;
          background-attachment: scroll;
        }

        .card {
          padding: 28px 18px;
          border-radius: 22px;
        }

        .link {
          grid-template-columns: 36px 1fr 32px;
          padding-inline: 12px;
        }

        .status {
          padding-inline: 6px;
          font-size: 0.58rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
    </style>
  </head>

  <body>
    <main class="card">
      <div class="avatar-wrap">
        <img
          class="avatar"
          src="https://github.com/anotherDavidSousa.png?size=240"
          alt="Foto de perfil de David Sousa"
          width="102"
          height="102"
        >
      </div>

      <h1>David Sousa</h1>
      <p class="handle">@anotherDavidSousa</p>
      <p class="intro">Desenvolvimento, automação e tecnologia aplicada a problemas reais.</p>

      <nav class="links" aria-label="Redes sociais e portfólio">
        <!-- Substitua SEU-USUARIO pelo endereço correto do LinkedIn. -->
        <a
          class="link linkedin"
          href="https://www.linkedin.com/in/dev-davidsousa/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Abrir o LinkedIn de David Sousa"
        >
          <span class="icon-box" aria-hidden="true">
            <img src="https://cdn.simpleicons.org/linkedin/ffffff" alt="">
          </span>
          <span class="label">LinkedIn</span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>

        <!-- Substitua SEU-USUARIO pelo usuário correto do Instagram. -->
        <a
          class="link instagram"
          href="https://www.instagram.com/s__david/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Abrir o Instagram de David Sousa"
        >
          <span class="icon-box" aria-hidden="true">
            <img src="https://cdn.simpleicons.org/instagram/ffffff" alt="">
          </span>
          <span class="label">Instagram</span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>

        <a
          class="link github"
          href="https://github.com/anotherDavidSousa"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Abrir o GitHub de David Sousa"
        >
          <span class="icon-box" aria-hidden="true">
            <img src="https://cdn.simpleicons.org/github/ffffff" alt="">
          </span>
          <span class="label">GitHub</span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>

        <div class="link portfolio" aria-disabled="true">
          <span class="icon-box" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="20" height="14" x="2" y="7" rx="2"></rect>
              <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              <path d="M12 12v.01"></path>
              <path d="M2 12a18 18 0 0 0 20 0"></path>
            </svg>
          </span>
          <span class="label">Portfólio</span>
          <span class="status">Em construção</span>
        </div>
      </nav>

      <footer>© 2026 David Sousa</footer>
    </main>
  </body>
</html>
